<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شنو أشتري؟</title>

<link rel="stylesheet" href="style.css">
</head>


<body>


<header>

<div class="logo">
🛍️ شنو أشتري؟
</div>


<nav>
<a href="#home">الرئيسية</a>
<a href="#smart">اختيار ذكي</a>
<a href="#products">المنتجات</a>
</nav>

</header>



<section id="home" class="hero">

<div>

<h1>
محتار شنو تشتري؟
<br>
خلينا نختار لك الأفضل 🤖
</h1>

<p>
حدد ميزانيتك واستخدامك
ونعطيك أفضل اختيار.
</p>


<a href="#smart">
ابدأ الاختيار
</a>


</div>

</section>





<section id="smart" class="smart">


<h2>
🧠 اختيار المنتج الذكي
</h2>


<p>
جاوب على الأسئلة ونرشح لك المنتج المناسب
</p>



<div class="box">


<label>
شنو تريد تشتري؟
</label>


<select id="category">

<option value="phone">
📱 موبايل
</option>

<option value="laptop">
💻 لابتوب
</option>

<option value="gaming">
🎮 ألعاب
</option>

<option value="audio">
🎧 سماعات
</option>

</select>



<label>
ميزانيتك
</label>


<select id="budget">

<option value="500">
أقل من 500 ألف
</option>

<option value="800">
500 - 800 ألف
</option>

<option value="1500">
أكثر من مليون
</option>

</select>



<label>
الاستخدام
</label>


<select id="usage">

<option value="camera">
📸 تصوير
</option>

<option value="gaming">
🎮 ألعاب
</option>

<option value="study">
📚 دراسة
</option>

<option value="battery">
🔋 بطارية
</option>

</select>



<button onclick="smartChoose()">
🔍 اختر لي
</button>



<div id="result"></div>


</div>


</section>







<section id="products">


<h2>
🔥 المنتجات
</h2>



<div id="productsBox"></div>


</section>






<footer>

<h3>
🛍️ شنو أشتري؟
</h3>

<p>
مساعدك الذكي لاختيار المنتجات
</p>

</footer>




<script src="app.js"></script>


</body>

</html>
